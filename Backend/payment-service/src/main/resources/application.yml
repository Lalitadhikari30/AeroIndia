server:
  port: 8084
  servlet:
    context-path: /api/payments

spring:
  application:
    name: payment-service
  datasource:
    url: jdbc:postgresql://localhost:5432/ticketing_payment
    username: postgres
    password: "${SPRING_DATASOURCE_PASSWORD:postgres}"
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true

payment:
  gateway:
    success-rate: 90
    min-latency-ms: 200
    max-latency-ms: 800

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
