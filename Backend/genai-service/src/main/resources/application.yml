server:
  port: 8086
  servlet:
    context-path: /api/genai

spring:
  application:
    name: genai-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/ticketing_genai?sslmode=disable}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: "${SPRING_DATASOURCE_PASSWORD:Lalit9968@}"
    driver-class-name: ${SPRING_DATASOURCE_DRIVER:org.postgresql.Driver}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URI:http://localhost:8761/eureka/}
    register-with-eureka: ${ENABLE_EUREKA:true}
    fetch-registry: ${ENABLE_EUREKA:true}
  instance:
    prefer-ip-address: true

genai:
  gemini:
    api-key: ${GEMINI_API_KEY:AQ.Ab8RN6Jm8mhU8Dyu7xYEypA8qS3NoBxJZf9nwUTlmFhseQhlZA}
    model: gemini-flash-latest
  anthropic:
    api-key: ${ANTHROPIC_API_KEY:stub}
    model: claude-sonnet-4-20250514
  voyage:
    api-key: ${VOYAGE_API_KEY:stub}
    model: voyage-3.5
  rag:
    top-k: 4
    similarity-threshold: 0.20
  stub-mode: false

gemini:
  api:
    key: ${GEMINI_API_KEY:AQ.Ab8RN6Jm8mhU8Dyu7xYEypA8qS3NoBxJZf9nwUTlmFhseQhlZA}
    model: gemini-flash-latest

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

feign:
  client:
    config:
      default:
        connect-timeout: 5000
        read-timeout: 5000
