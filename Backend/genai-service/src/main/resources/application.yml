server:
  port: 8086
  servlet:
    context-path: /api/genai

spring:
  application:
    name: genai-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:h2:mem:ticketing_genai;DB_CLOSE_DELAY=-1;MODE=PostgreSQL}
    username: ${SPRING_DATASOURCE_USERNAME:sa}
    password: "${SPRING_DATASOURCE_PASSWORD:}"
    driver-class-name: ${SPRING_DATASOURCE_DRIVER:org.h2.Driver}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URI:http://localhost:8761/eureka/}
    register-with-eureka: ${ENABLE_EUREKA:false}
    fetch-registry: ${ENABLE_EUREKA:false}
  instance:
    prefer-ip-address: true

genai:
  anthropic:
    api-key: ${ANTHROPIC_API_KEY:stub}
    model: claude-sonnet-4-20250514
  voyage:
    api-key: ${VOYAGE_API_KEY:stub}
    model: voyage-3.5
  rag:
    top-k: 4
    similarity-threshold: 0.20
  stub-mode: true

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

feign:
  client:
    config:
      default:
        connect-timeout: 5000
        read-timeout: 5000
